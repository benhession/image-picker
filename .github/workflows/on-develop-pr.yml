name: Pull request pipeline

on:
  pull_request:
    branches:
      - 'develop'

env:
  TF_WORKSPACE: ${{vars.DEV_TF_WORKSPACE}}
  TERRAFORM_VERSION: '1.10.3'

jobs:
  call-build-push-image-classifier:
    uses: ./.github/workflows/build-push-image-classifier.yml
    with:
      AWS_REGION: ${{vars.DEV_AWS_REGION}}
      IMAGES_BUCKET_NAME: ${{vars.DEV_IMAGES_BUCKET_NAME}}
      tag-as-latest: false
    secrets:
      AWS_ACCESS_KEY_ID: ${{secrets.DEV_AWS_ACCESS_KEY_ID}}
      AWS_ACCESS_SECRET_KEY: ${{secrets.DEV_AWS_ACCESS_SECRET_KEY}}

  call-build-gradle-project:
