test-variables:
  bucket-name: "test-bucket"
  processing-queue-name: "processing-test-queue"
  cropping-queue-name: "cropping-test-queue"
  aws-region: "us-east-1"
  aws-access-key-id: "test-key"
  aws-secret-access-key: "test-secret"

bucket.name: ${BUCKET_NAME}

queue:
  image-processing-queue:
    url: ${IMAGE_PROCESSING_QUEUE_URL}
  image-cropping-queue:
    url: ${IMAGE_CROPPING_QUEUE_URL}

quarkus:
  oidc:
    auth-server-url: ${AUTH_SERVER_URL}
    client-id: ${OIDC_CLIENT_ID}
    credentials:
      secret: ${OIDC_CLIENT_SECRET}
    roles:
      role-claim-path: "permissions"

  s3.aws:
    credentials.type: "default"

  mongodb:
    database: ${MONGODB_DATABASE_NAME}

  http:
    proxy:
      proxy-address-forwarding: true
      enable-forwarded-host: true
    root-path: "/api"

validation-messages:
  system:
    error: "An unexpected error has occurred."

"%prod":
  quarkus:
    mongodb:
      connection-string: ${MONGODB_CONNECTION_STRING}

"%dev":

  queue:
    image-processing-queue:
      url: ${test-variables.processing-queue-name}
    image-cropping-queue:
      url: ${test-variables.cropping-queue-name}

  bucket:
    name: ${test-variables.bucket-name}

  quarkus:
    lambda:
      mock-event-server:
        dev-port: "8080"
    mongodb:
      connection-string: "mongodb://localhost:8180"
    sqs:
      devservices:
        queues:
          - ${test-variables.processing-queue-name}
          - ${test-variables.cropping-queue-name}
        shared: true
      aws:
        credentials:
          type: "static"
          static-provider:
            access-key-id: ${test-variables.aws-access-key-id}
            secret-access-key: ${test-variables.aws-secret-access-key}
    s3:
      path-style-access: true
      devservices:
        buckets: ${test-variables.bucket-name}
        shared: true
      aws:
        credentials:
          type: "static"
          static-provider:
            access-key-id: ${test-variables.aws-access-key-id}
            secret-access-key: ${test-variables.aws-secret-access-key}

"%test":

  queue:
    image-processing-queue:
      url: ${test-variables.processing-queue-name}
    image-cropping-queue:
      url: ${test-variables.cropping-queue-name}

  bucket:
    name: ${test-variables.bucket-name}

  quarkus:
    sqs:
      devservices:
        queues:
          - ${test-variables.processing-queue-name}
          - ${test-variables.cropping-queue-name}
      aws:
        credentials:
          type: "static"
          static-provider:
            access-key-id: ${test-variables.aws-access-key-id}
            secret-access-key: ${test-variables.aws-secret-access-key}

    s3:
      devservices:
        buckets: ${test-variables.bucket-name}
      aws:
        credentials:
          type: "static"
          static-provider:
            access-key-id: ${test-variables.aws-access-key-id}
            secret-access-key: ${test-variables.aws-secret-access-key}

    mongodb:
      devservices:
        enabled: false

  image:
    accepted-mime-types:
      - "image/jpeg"
      - "image/png"
      - "image/gif"

    size:
      square:
        aspect-ratio: "1:1"
        min-width: "1200"
        thumbnail:
          scaling-factor: "0.1"
        small:
          scaling-factor: "0.3"
        medium:
          scaling-factor: "0.7"
        large:
          scaling-factor: "1"

      panoramic:
        aspect-ratio: "2:1"
        min-width: "2000"
        thumbnail:
          scaling-factor: "0.1"
        small:
          scaling-factor: "0.3"
        medium:
          scaling-factor: "0.7"
        large:
          scaling-factor: "1"

      rectangular:
        aspect-ratio: "4:3"
        min-width: "1200"
        thumbnail:
          scaling-factor: "0.1"
        small:
          scaling-factor: "0.3"
        medium:
          scaling-factor: "0.7"
        large:
          scaling-factor: "1"

      wide:
        aspect-ratio: "16:9"
        min-width: "1600"
        thumbnail:
          scaling-factor: "0.1"
        small:
          scaling-factor: "0.3"
        medium:
          scaling-factor: "0.7"
        large:
          scaling-factor: "1"